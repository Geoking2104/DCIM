version: "3.8"

services:
  qinode-gateway:
    build:
      context: ./crates
      dockerfile: Dockerfile
    container_name: qinode-gateway
    ports:
      - "8088:8088"
    environment:
      - LISTEN=0.0.0.0:8088
      - NEST_GRAPHQL_URL=http://host.docker.internal:4000/graphql

  graph-db:
    image: neo4j:5.12-community
    container_name: dcim-graph-db
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/dcim_secure_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  timeseries-db:
    image: clickhouse/clickhouse-server:23.8
    container_name: dcim-timeseries-db
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

  event-bus:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: dcim-event-bus
    ports:
      - "9092:9092"
      - "9644:9644"
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://event-bus:29092,OUTSIDE://localhost:9092

  vector-db:
    image: qdrant/qdrant:v1.6.1
    container_name: dcim-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  ai-engine:
    image: ollama/ollama:latest
    container_name: dcim-ai-engine
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: ["gpu"]

volumes:
  neo4j_data:
  clickhouse_data:
  qdrant_data:
  ollama_data:

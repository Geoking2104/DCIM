apiVersion: 1
contactPoints:
  - orgId: 1
    name: qinode-ops
    receivers:
      - uid: qinode-webhook
        type: webhook
        settings:
          url: ${GRAFANA_ALERT_WEBHOOK:-http://host.docker.internal:4000/alerts}
          httpMethod: POST
      - uid: qinode-email
        type: email
        settings:
          addresses: ${GRAFANA_ALERT_EMAIL:-ops@qinode.eu}
          singleEmail: true

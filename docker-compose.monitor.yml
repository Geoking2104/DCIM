services:
  telegraf:
    image: telegraf:1.32-alpine
    container_name: dcim-telegraf
    depends_on:
      - timeseries-db
    volumes:
      - ./ops/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      SNMP_AGENT: ${SNMP_AGENT:-192.0.2.10}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      REDFISH_HOST: ${REDFISH_HOST:-}
      REDFISH_USER: ${REDFISH_USER:-}
      REDFISH_PASSWORD: ${REDFISH_PASSWORD:-}
    profiles: ["monitor"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dcim-prometheus
    depends_on:
      - timeseries-db
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["monitor", "alert"]

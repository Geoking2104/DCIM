[agent]
  interval = "10s"
  hostname = "qinode-edge"

[[outputs.clickhouse]]
  url = "http://timeseries-db:8123"
  database = "dcim"
  # table attendue : power_metrics (grid_power_kw, ups_power_kw, pdu_power_kw, rack_power_kw, battery_cell_temp, voltage, rack_id, timestamp)

# PDU / ToR — lecture seule. Adapter l'OID à la marque.
[[inputs.snmp]]
  agents = ["${SNMP_AGENT:192.0.2.10}"]
  version = 2
  community = "${SNMP_COMMUNITY:public}"
  [[inputs.snmp.field]]
    name = "pdu_power_kw"
    oid = "1.3.6.1.2.1.33.1.4.4.1.4.1"
    conversion = "float(3)"


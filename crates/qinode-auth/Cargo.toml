[package]
name = "qinode-auth"
version.workspace = true
edition.workspace = true

[dependencies]
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  topology-api:
    name: Topology API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dcim-topology-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dcim-topology-service/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.12-community
        env:
          NEO4J_AUTH: neo4j/ci_neo4j_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci_neo4j_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci_neo4j_password
      QINODE_NEO4J_INTEGRATION: "true"
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust with quality tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  deployment-smoke:
    name: Container readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start stateful dependencies
        run: docker compose up --build --wait --wait-timeout 300 graph-db timeseries-db qinode-gateway
      - name: Verify liveness and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8088/health/live
          curl --fail --silent --show-error http://127.0.0.1:8088/health/ready
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color graph-db timeseries-db qinode-gateway
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans

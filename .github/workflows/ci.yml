name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  topology-api:
    name: Topology API
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.12-community
        env:
          NEO4J_AUTH: neo4j/ci_neo4j_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci_neo4j_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: dcim-topology-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: dcim-topology-service/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - name: Smoke boot (service + GraphQL round-trip)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: ci_neo4j_password
          KEYCLOAK_OPTIONAL: "true"
          PORT: "4001"
        run: |
          node dist/main.js > /tmp/topology-smoke.log 2>&1 &
          APP_PID=$!
          READY=0
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null -X POST http://127.0.0.1:4001/graphql \
              -H 'content-type: application/json' --data '{"query":"{ racks { id name } }"}'; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Service non disponible apres 60 s"; tail -n 50 /tmp/topology-smoke.log
            kill "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:4001/graphql \
            -H 'content-type: application/json' \
            --data '{"query":"mutation { createRack(input: {name: \"CI-SMOKE\", heightU: 42, siteId: \"ci\"}) { id name } }"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"createRack"' || { echo "createRack a echoue"; kill "$APP_PID" 2>/dev/null || true; exit 1; }
          kill "$APP_PID" 2>/dev/null || true

  rust:
    name: Rust workspace
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.12-community
        env:
          NEO4J_AUTH: neo4j/ci_neo4j_password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci_neo4j_password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci_neo4j_password
      QINODE_NEO4J_INTEGRATION: "true"
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v7
      - name: Install stable Rust with quality tools
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Build gateway binary
        run: cargo build -p qinode-gateway
      - name: Smoke boot (gateway + GraphQL round-trip)
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ci_neo4j_password
          KEYCLOAK_OPTIONAL: "true"
          LISTEN: 127.0.0.1:8088
        run: |
          ./target/debug/qinode-gateway > /tmp/gateway-smoke.log 2>&1 &
          GW_PID=$!
          READY=0
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8088/health; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Gateway non disponible apres 60 s"; tail -n 50 /tmp/gateway-smoke.log
            kill "$GW_PID" 2>/dev/null || true
            exit 1
          fi
          RESPONSE=$(curl -sf -X POST http://127.0.0.1:8088/graphql \
            -H 'content-type: application/json' \
            --data '{"query":"mutation { createRack(input: {name: \"CI-SMOKE-RUST\", heightU: 42, siteId: \"ci\"}) { id name heightU siteId } }"}')
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"createRack"' || { echo "createRack (rust) a echoue"; kill "$GW_PID" 2>/dev/null || true; exit 1; }
          QUERY=$(curl -sf -X POST http://127.0.0.1:8088/graphql \
            -H 'content-type: application/json' \
            --data '{"query":"{ racks { id name heightU siteId } }"}')
          echo "$QUERY"
          echo "$QUERY" | grep -q 'CI-SMOKE-RUST' || { echo "lecture racks a echoue"; kill "$GW_PID" 2>/dev/null || true; exit 1; }
          kill "$GW_PID" 2>/dev/null || true

  deployment-smoke:
    name: Container readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build and start stateful dependencies
        run: docker compose up --build --wait --wait-timeout 300 graph-db timeseries-db qinode-gateway
      - name: Verify liveness and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8088/health/live
          curl --fail --silent --show-error http://127.0.0.1:8088/health/ready
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color graph-db timeseries-db qinode-gateway
      - name: Stop containers
        if: always()
        run: docker compose down --volumes --remove-orphans

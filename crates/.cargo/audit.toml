  "RUSTSEC-2024-0384", # instant 0.1.13 — unmaintained (via backoff/neo4rs)
  "RUSTSEC-2024-0436", # paste 1.0.15 — unmaintained (via neo4rs)
  "RUSTSEC-2025-0134", # rustls-pemfile 2.2.0 — unmaintained (via neo4rs)
]

services:
  telegraf:
    image: telegraf:1.32-alpine
    container_name: dcim-telegraf
    depends_on:
      - timeseries-db
    volumes:
      - ./ops/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      SNMP_AGENT: ${SNMP_AGENT:-192.0.2.10}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-public}
      REDFISH_HOST: ${REDFISH_HOST:-}
      REDFISH_USER: ${REDFISH_USER:-}
      REDFISH_PASSWORD: ${REDFISH_PASSWORD:-}
    profiles: ["monitor"]

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dcim-prometheus
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus-rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    profiles: ["monitor", "alert"]

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dcim-grafana
    depends_on:
      - timeseries-db
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-qinode}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_SMTP_ENABLED: ${GF_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GF_SMTP_HOST:-}
      GF_SMTP_USER: ${GF_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS:-grafana@qinode.eu}
      GRAFANA_ALERT_WEBHOOK: ${GRAFANA_ALERT_WEBHOOK:-http://host.docker.internal:4000/alerts}
      GRAFANA_ALERT_EMAIL: ${GRAFANA_ALERT_EMAIL:-ops@qinode.eu}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: ["monitor", "viz"]

volumes:
  grafana_data:
